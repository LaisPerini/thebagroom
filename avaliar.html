    <form class="av-form" id="avForm" hidden novalidate>
      <div class="av-bolsa" id="avBolsa"></div>

      <textarea id="avComentario" maxlength="1500" placeholder="Como foi usar a bolsa, a entrega, o atendimento..."></textarea>
      <label class="av-check"><input type="checkbox" id="avPublicar" checked> Autorizo a The Bag Room a mostrar esta avaliação no site e nas redes, apenas com o meu primeiro nome.</label>
      <p class="av-erro" id="avErro" role="alert"></p>
      <div class="actions"><button type="submit" class="btn" id="avEnviar">Enviar avaliação</button></div>
    </form>

    <div class="actions" id="avAcoes" hidden>
      <a class="btn" href="/aluguel.html">Ver bolsas</a>
      <a class="btn secondary" href="/minha-conta.html">Minha conta</a>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
  (function () {
    const db = supabase.createClient("https://zpyjnqkrsmgpwszqlcrs.supabase.co", "sb_publishable_48rLPZfPRNtRX1kpYm0aWg_aVI1Hi2b");
    const $ = id => document.getElementById(id);
    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const LEGENDAS = ['', 'Não gostei', 'Poderia ser melhor', 'Boa', 'Muito boa', 'Perfeita'];
    const ESTRELA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>';
    const params = new URLSearchParams(location.search);
    const pedidoId = params.get('pedido') || '';
    let nota = Math.min(5, Math.max(0, parseInt(params.get('nota'), 10) || 0));

    function fim(titulo, texto, mostrarAcoes = true) {
      $('avTitulo').textContent = titulo; $('avIntro').textContent = texto;
      $('avForm').hidden = true; $('avAcoes').hidden = !mostrarAcoes;
    }
    function pintar() {
      [...$('avEstrelas').children].forEach((b, i) => { b.classList.toggle('on', i < nota); b.setAttribute('aria-checked', String(i + 1 === nota)); });
      $('avLegenda').textContent = LEGENDAS[nota] || 'Toque nas estrelas';
    }

    async function iniciar() {
      if (!/^[0-9a-f-]{36}$/i.test(pedidoId)) return fim('Link inválido', 'Abra o link que enviamos por e-mail ou fale com a nossa curadoria.');
      const { data: { session } } = await db.auth.getSession();
      if (!session) { location.href = '/login.html?next=' + encodeURIComponent(location.pathname + location.search); return; }
      const [{ data: pedido }, { data: ja }] = await Promise.all([
        db.from('aluguel_pedidos').select('id,status,aluguel_itens(bolsas(nome,marca,slug,imagem_capa_url))').eq('id', pedidoId).maybeSingle(),
        db.from('avaliacoes').select('id').eq('pedido_id', pedidoId).maybeSingle()
      ]);
      if (!pedido) return fim('Pedido não encontrado', 'Confira se você entrou com a mesma conta usada no aluguel.');
      if (ja) return fim('Obrigada!', 'Você já avaliou este aluguel. A sua opinião é muito importante para nós.');
      if (!['devolvido', 'caucao_liberada'].includes(pedido.status)) return fim('Ainda não é hora', 'A avaliação fica disponível depois que a bolsa é devolvida.');
      const item = (pedido.aluguel_itens || [])[0] || {};
      const b = Array.isArray(item.bolsas) ? item.bolsas[0] : item.bolsas;
      if (b) {
        const nome = b.marca && !String(b.nome || '').toLowerCase().startsWith(b.marca.toLowerCase()) ? b.marca + ' ' + b.nome : b.nome;
        const capas = window.tbrCapasVitrine ? await window.tbrCapasVitrine() : {};
        const foto = capas[b.slug] || b.imagem_capa_url || window.TBR_MANUAL_PHOTOS?.[b.slug]?.cover || '';
        $('avBolsa').innerHTML = `${foto ? `<img src="${esc(foto)}" alt="">` : ''}<div><small>Seu aluguel</small><strong>${esc(nome)}</strong></div>`;
      } else $('avBolsa').remove();
      $('avEstrelas').innerHTML = [1, 2, 3, 4, 5].map(n => `<button type="button" role="radio" aria-label="${n} de 5 estrelas">${ESTRELA}</button>`).join('');
      [...$('avEstrelas').children].forEach((btn, i) => btn.addEventListener('click', () => { nota = i + 1; pintar(); $('avErro').textContent = ''; }));
      pintar();
      $('avIntro').textContent = 'Leva menos de um minuto e ajuda muito a nossa curadoria.';
      $('avForm').hidden = false;
    }

    $('avForm').addEventListener('submit', async e => {
      e.preventDefault();
      if (!nota) { $('avErro').textContent = 'Escolha de 1 a 5 estrelas.'; return; }
      $('avEnviar').disabled = true; $('avEnviar').textContent = 'Enviando...';
      const { error } = await db.from('avaliacoes').insert({
        pedido_id: pedidoId, nota, comentario: $('avComentario').value.trim() || null, autoriza_publicacao: $('avPublicar').checked
      });
      if (error) {
        console.error(error);
        $('avErro').textContent = /duplicate|unique/i.test(error.message) ? 'Você já avaliou este aluguel.' : 'Não foi possível enviar agora. Tente de novo em instantes.';
        $('avEnviar').disabled = false; $('avEnviar').textContent = 'Enviar avaliação';
        return;
      }
      fim('Obrigada!', nota >= 4 ? 'Ficamos muito felizes em saber. Esperamos te ver de novo em breve.' : 'Obrigada pela sinceridade. A nossa curadoria vai ler com atenção.');
    });

    iniciar().catch(err => { console.error(err); fim('Algo deu errado', 'Atualize a página ou fale com a nossa curadoria.'); });
  })();
  </script>
<script>
function toggleMenuMobile() {
  const menu = document.getElementById('menuMobile');
  if (menu) menu.classList.toggle('open');
}
</script>
