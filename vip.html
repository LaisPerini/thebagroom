.botao.vip::after{

position:absolute;
top:0;
left:-120%;
width:65%;
height:100%;

background:linear-gradient(
110deg,
transparent,
rgba(255,255,255,0.75),
transparent

animation:brilho 4s infinite;
z-index:1;
pointer-events:none;
}

@keyframes brilho{
0%{
left:-120%;
}

35%{
left:140%;
}

100%{
left:140%;
}
}
